[project]
name = "blue-team-ai"
version = "0.1.0"
description = "Syslog triage: deterministic detection rules first, an LLM classifier second"
readme = "README.md"
requires-python = ">=3.8"
authors = [
{ name = "Aaron Sawit" }
]
license = { text = "MIT" }

[project.scripts]
blueai = "blue_team_ai.cli:main"

[project.urls]
"Homepage" = "https://github.com/aaronsawit/blue-team-ai"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

